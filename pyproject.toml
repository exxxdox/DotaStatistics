[project]
name = "dota-statistics"
version = "0.1.0"
description = "QQ bot for Dota 2 player statistics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.11.1,<4",
    # DeepSeek 当前使用 OpenAI v2 兼容接口，避免自动跨主版本升级破坏运行时。
    "openai>=2.8.1,<3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "qq-botpy>=1.2.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
# 设为 default 会关闭隐式 PyPI，确保锁定和安装都统一使用清华镜像。
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
