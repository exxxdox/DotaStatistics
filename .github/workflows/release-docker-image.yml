name: Release Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Run tests before packaging
        shell: bash
        run: |
          set -euo pipefail
          # Docker 构建不会导入业务模块；发布前必须运行真实测试。
          uv run --frozen pytest

      - name: Build and package Docker image
        id: package
        shell: bash
        run: |
          set -euo pipefail

          project_name="${GITHUB_REPOSITORY##*/}"
          project_name="${project_name,,}"
          safe_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')"
          safe_tag="${safe_tag:0:120}"
          if [[ -z "$safe_tag" ]]; then
            safe_tag="${GITHUB_SHA:0:12}"
          fi
          # Git 标签转换后可能以点或横线开头，Docker 要求首字符为字母、数字或下划线。
          case "$safe_tag" in
            [A-Za-z0-9_]*) ;;
            *) safe_tag="v-${safe_tag}" ;;
          esac

          image_ref="dota:${safe_tag}"
          archive="${project_name}-${safe_tag}-linux-amd64-docker-image.tar"

          docker build --platform linux/amd64 --tag "$image_ref" .
          docker image inspect "$image_ref" >/dev/null
          docker save --output "$archive" "$image_ref"

          echo "archive=$archive" >>"$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >>"$GITHUB_OUTPUT"

      - name: Push Docker Hub image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_REF: ${{ steps.package.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          # 复用 TAR 对应的镜像，避免重复构建导致两处发布内容不同。
          docker tag "$IMAGE_REF" exxxdox/dota-bot:latest
          # 令牌只通过标准输入传递，避免出现在命令参数和日志中。
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker push exxxdox/dota-bot:latest

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
