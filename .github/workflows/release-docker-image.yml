name: Release Docker image

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Run tests before packaging
        shell: bash
        run: |
          set -euo pipefail
          # Docker 构建不会导入业务模块；发布前必须运行真实测试。
          uv run --frozen pytest

      - name: Build and package Docker image
        id: package
        shell: bash
        run: |
          set -euo pipefail

          project_name="${GITHUB_REPOSITORY##*/}"
          project_name="${project_name,,}"
          safe_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')"
          safe_tag="${safe_tag:0:120}"
          if [[ -z "$safe_tag" ]]; then
            safe_tag="${GITHUB_SHA:0:12}"
          fi

          image_ref="dota:${safe_tag}"
          archive="${project_name}-${safe_tag}-linux-amd64-docker-image.tar"

          docker build --platform linux/amd64 --tag "$image_ref" .
          docker image inspect "$image_ref" >/dev/null
          docker save --output "$archive" "$image_ref"

          echo "archive=$archive" >>"$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
