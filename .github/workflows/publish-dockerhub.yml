name: Publish Docker Hub image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Run tests before publishing
        shell: bash
        run: |
          set -euo pipefail
          # 独立工作流不会等待 Release 的测试，推送镜像前必须自行验证。
          uv run --frozen pytest

      - name: Build and push Docker Hub image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --tag exxxdox/pri:dota .
          # 令牌只通过标准输入传递，避免出现在命令参数和日志中。
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker push exxxdox/pri:dota
