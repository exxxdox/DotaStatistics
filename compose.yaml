services:
  dota:
    build:
      context: .
    image: dota:local
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 10s
    env_file:
      - .env
    environment:
      # 只把运行时 JSON 写入持久目录，避免覆盖镜像内的英雄名称静态资源。
      DATA_DIR: /data
    volumes:
      # 禁止 Compose 以 root 自动创建目录；README 的初始化命令负责正确权限。
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
networks: {}
