services:
  dota:
    build:
      context: .
    image: dota:local
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 10s
    env_file:
      - .env
    environment:
      # 只把运行时 JSON 写入持久目录，避免覆盖镜像内的英雄名称静态资源。
      DATA_DIR: /data
    volumes:
      # 入口在 Linux 修正目录所有权；Windows bind mount 使用宿主机 ACL。
      - ./data:/data
networks: {}
